entity_counts:
  # Number of friendly UAVs generated in each scene by default.
  friendly_uavs: 3
  # Number of key enemy targets generated in each scene by default.
  key_targets: 3
  # Number of non-key enemy targets generated in each scene by default.
  nonkey_targets: 6

initialization:
  # Distance range in meters used when sampling non-key enemies near key targets.
  nonkey_enemy_nearby_distance_m: [2.0, 8.0]
  # Distance range in meters used when sampling friendly UAVs around the key-target cluster.
  # The current sampler keeps friendlies near the shared key-target center, so increasing this
  # range spreads them out more while still preserving overlapping fields of view.
  friendly_uav_nearby_distance_m: [5.0, 10.0]
  # Minimum separation in meters enforced between sampled friendly UAV initial positions.
  friendly_uav_min_separation_m: 10.0

enemy_mobility:
  # Enemy motion model used to update target trajectories each simulation step.
  model: gauss_markov
  # Size of the 3D map in meters: [x_max, y_max, z_max].
  bounds: [70.0, 70.0, 20.0]
  # Minimum distance kept from the map boundary when clipping positions.
  # This avoids agents being updated exactly onto the edge of the valid region.
  safety_margin: 1.0
  vmax:
    # Maximum speed of enemy nodes in meters per second.
    enemy: 4.0
    # Maximum speed of friendly UAVs in meters per second.
    friendly: 5.0

  gauss_markov:
    # Memory factor of the Gauss-Markov process.
    # Larger values make motion smoother and more correlated with the previous direction.
    alpha: 0.9
    # Time interval in seconds between heading updates.
    # Larger values make target heading changes less frequent.
    direction_update_interval: 2.0
    # Standard deviation of horizontal direction noise.
    # Larger values produce more random turning in the x-y plane.
    direction_noise_std: 0.5
    # Standard deviation of vertical pitch noise.
    # Larger values produce stronger climb/dive fluctuations.
    pitch_noise_std: 0.2

  random_walk:
    travel_duration: 4.0
    pitch_limit: 1.0471975512

  non_key_companion:
    # Keep non-key enemy trajectories correlated with nearby key enemies without making
    # them identical. Initial positions are already sampled near key enemies; this also
    # gives each non-key enemy a similar initial heading and pitch to its anchor key.
    enabled: true
    # Radians of initial heading jitter around the anchor key enemy.
    direction_jitter_std: 0.02
    # Radians of initial pitch jitter around the anchor key enemy.
    pitch_jitter_std: 0.01

simulation:
  # Physical simulation time interval in seconds for one environment step.
  dt: 0.5

  # Number of environment steps per rollout or episode.
  num_steps: 20
  # Whether to print the initial positions of all entities when a simulation starts.
  print_initial_positions: false
  # Whether to print positions at every time step during simulation.
  # Enabling this is useful for debugging but can produce verbose logs.
  print_timestep_positions: false

tracking:
  # Input contract exposed to the tracking layer.
  # - local_only: use noisy external priors + local observations + association baseline
  # - groundtruth: bypass local association and expose key-target truth tracks directly
  mode: local_only
  # Association method used only in local_only mode.
  # - none: no probabilistic association, just use the nearest local candidate
  # - bp_jpda: multi-key BP-optimised JPDA baseline
  # - gm_phd: multi-target GM-PHD baseline
  # - lmb: labeled multi-Bernoulli style baseline with key-track existence recursion
  # - delta_glmb: compact delta-GLMB style labeled multi-hypothesis baseline
  association_method: bp_jpda
  # Downstream key-track assignment method used after centralized fusion.
  # - placeholder: return an empty assignment result
  # - hungarian: solve a minimum-distance centralized assignment from UAVs to fused key tracks
  assignment: hungarian

global_sensing:
  # Standard MTT notation: this block defines the diagonal entries of the weak
  # external key-target prior covariance P^- for x_prior = [x, y, z, vx, vy, vz].
  # Position std in meters for [x, y, z].
  prior_position_std_m: [5.0, 5.0, 1.0]
  # Velocity std in meters per second for [vx, vy, vz].
  prior_velocity_std_mps: [1.0, 1.0, 0.2]

local_sensing:
  # Omnidirectional detection radius in meters for each friendly UAV.
  detection_radius_m: 50.0
  # Fixed number of local target candidates returned per friendly UAV.
  # Friendly UAVs are not included in these candidate slots.
  max_candidates: 10
  # Standard MTT notation: this block defines the diagonal entries of the local
  # measurement covariance R for z = [dx, dy, dz, dvx, dvy, dvz].
  # Position-measurement std in meters for relative [dx, dy, dz].
  measurement_position_std_m: [2.0, 2.0, 0.4]
  # Velocity-measurement std in meters per second for relative [dvx, dvy, dvz].
  measurement_velocity_std_mps: [1.0, 1.0, 0.2]
  # Probability that an in-range real target generates a local measurement at one step.
  detection_probability: 0.95
  # Average number of clutter / false-alarm measurements generated per second inside
  # one UAV's local measurement space. The code converts this to a per-step Poisson
  # mean by multiplying with simulation.dt.
  clutter_rate_per_second: 1.0

association:
  # Mahalanobis gating threshold applied using each predicted key-track covariance
  # plus the local measurement covariance. Larger values keep more candidate edges.
  bp_jpda_gate_sigma: 3.0
  # Maximum number of loopy BP fixed-point iterations per friendly UAV and time step.
  bp_jpda_max_iterations: 30
  # Stop BP early when the maximum message update falls below this tolerance.
  bp_jpda_convergence_tol: 1.0e-3
  # Keep a non-zero missed-detection branch even when local detection_probability is very high.
  bp_jpda_min_missed_detection_probability: 0.05
  # Motion-prior family used by the recursive local estimators.
  # - cv: single constant-velocity model
  # - imm: interacting multiple-model bank over imm_model_types
  recursive_motion_model: imm
  # Motion-model bank used when recursive_motion_model = imm.
  # Supported entries:
  # - cv: constant velocity
  # - ca: constant acceleration using an internal acceleration state
  # - ct_left: fixed-rate coordinated left turn in the horizontal plane
  # - ct_right: fixed-rate coordinated right turn in the horizontal plane
  # - ct: fixed-rate coordinated turn using the sign of imm_turn_rate_radps
  imm_model_types: [cv, ca, ct_left, ct_right]
  # Row-stochastic Markov transition matrix between IMM motion models.
  # Row i -> column j is P(model_t = j | model_{t-1} = i).
  imm_model_transition_matrix:
    - [0.88, 0.04, 0.04, 0.04]
    - [0.08, 0.82, 0.05, 0.05]
    - [0.08, 0.05, 0.82, 0.05]
    - [0.08, 0.05, 0.05, 0.82]
  # Initial model probabilities used when a new recursive track is born.
  imm_initial_model_probabilities: [0.70, 0.10, 0.10, 0.10]
  # Fixed turn-rate magnitude used by the coordinated-turn IMM branches.
  imm_turn_rate_radps: 0.35
  # Scale factor applied to the base process noise on coordinated-turn branches.
  imm_ct_process_noise_scale: 1.25
  # Survival probability used by recursive local track prediction.
  gm_phd_survival_probability: 0.98
  # Birth / anchor strength used when injecting weak key priors into the local filters.
  gm_phd_birth_weight: 0.25
  # Drop GM-PHD mixture components whose weight falls below this value.
  gm_phd_prune_threshold: 1.0e-2
  # Merge nearby GM-PHD components when their Mahalanobis distance is below this threshold.
  gm_phd_merge_mahalanobis: 2.0
  # Cap the number of GM-PHD Gaussian components carried per friendly UAV.
  gm_phd_max_components: 10
  # A recursive association output is marked valid only when posterior confidence reaches this
  # threshold and at least one local measurement contributed positive support.
  gm_phd_confidence_threshold: 0.1
  # Cap the number of joint association hypotheses retained by the delta-GLMB baseline.
  delta_glmb_max_hypotheses: 48
  # Drop delta-GLMB hypotheses whose normalized weight falls below this threshold.
  delta_glmb_hypothesis_weight_prune_threshold: 1.0e-4
  # Base process-noise position std used by the recursive local motion prior.
  # The IMM predictor reuses this as the shared base noise across its motion branches.
  gm_phd_process_position_std_m: [2.5, 2.5, 1.0]
  # Base process-noise velocity std used by the recursive local motion prior.
  gm_phd_process_velocity_std_mps: [1.3, 1.3, 0.5]

track_fusion:
  # Position std of each friendly UAV localization estimate when lifting local
  # relative tracks into the shared global frame.
  self_position_std_m: [0.5, 0.5, 0.1]
  # Minimum local-track confidence required before participating in cross-UAV fusion.
  min_confidence: 0.1
  # Reject a candidate when its Mahalanobis distance to the current fused state is too large.
  mahalanobis_distance_threshold: 3.0
  # Number of grid samples used to choose the pairwise covariance-intersection weight.
  ci_search_steps: 21
